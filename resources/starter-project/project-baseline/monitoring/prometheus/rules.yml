groups:
  - name: mlops-course
    rules:
      - alert: MLServiceNotReady
        expr: mlops_model_ready == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML model is not ready"
          description: "The model-ready gauge has been zero for at least one minute."

      - alert: MLServiceHighErrorRate
        expr: |
          sum(rate(mlops_http_requests_total{status=~"5.."}[2m]))
          /
          clamp_min(sum(rate(mlops_http_requests_total[2m])), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of requests returned 5xx responses."

      - alert: MLServiceHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(mlops_http_request_duration_seconds_bucket{endpoint="/predict"}[5m]))
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High prediction latency"
          description: "Prediction p95 latency is above one second."
