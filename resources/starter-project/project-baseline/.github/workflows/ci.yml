name: student-ml-project-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" pyyaml
      - name: Generate reproducible data
        run: python scripts/generate_data.py --output-dir data --random-state 42
      - name: Train baseline model
        run: python -m mlops_course.train
      - name: Run tests
        run: pytest
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build API image
        run: docker build --tag mlops-course-api:ci .
