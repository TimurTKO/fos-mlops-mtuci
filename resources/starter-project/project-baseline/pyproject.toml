[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-course-baseline"
version = "0.3.0"
description = "Учебный базовый проект для дисциплины MLOps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "httpx>=0.27,<1.0",
  "joblib>=1.3,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "prometheus-client>=0.20,<1.0",
  "pydantic>=2.6,<3.0",
  "scikit-learn>=1.4,<2.0",
  "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pyyaml>=6.0,<7.0"]
mlops = [
  "dvc>=3.60,<4.0",
  "mlflow>=3.0,<4.0",
  "pyyaml>=6.0,<7.0",
]
all = [
  "pytest>=8.0,<9.0",
  "dvc>=3.60,<4.0",
  "mlflow>=3.0,<4.0",
  "pyyaml>=6.0,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
