# Граф воспроизводимого пайплайна — шаблон студенческого комплекта.
#
# TODO (ЛР4): описать этапы пайплайна и связать их через зависимости и выходы.
#
# Минимальный обязательный состав — этапы `generate_data` и `train`.
# Для каждого этапа укажите:
#   cmd     — воспроизводимую команду запуска;
#   deps    — код и данные, изменение которых требует пересчёта;
#   params  — параметры из params.yaml, а не значения в самой команде;
#   outs    — артефакты этапа;
#   metrics — файл метрик этапа обучения.
#
# После описания графа проверьте:
#   dvc repro
#   dvc metrics show
#   dvc checkout   # восстановление предыдущей версии данных и модели
#
# Файл dvc.lock формируется автоматически и в комплект не входит.

